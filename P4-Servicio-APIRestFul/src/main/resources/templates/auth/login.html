<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Iniciar sesión</h1>
        <p class="page-subtitle">
            Accede con tu usuario para gestionar la aplicación de alquiler de vehículos.
        </p>
    </section>

    <section class="card form-card">
        <div class="card__header">
            <h2 class="card__title">Acceso de usuario</h2>
        </div>

        <div class="card__body">

            <div th:if="${param.error}" class="alert alert--error">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert alert--success">
                Has cerrado sesión correctamente.
            </div>

            <div th:if="${param.registroOk}" class="alert alert--success">
                Usuario registrado correctamente. Ya puedes iniciar sesión.
            </div>

            <form th:action="@{/login}" method="post" class="form-grid">

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Introduce tu nombre de usuario"
                            required
                            autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Introduce tu contraseña"
                            required>
                </div>

                <div class="form-actions">
                    <a th:href="@{/}" class="btn btn--outline">Volver al inicio</a>
                    <button type="submit" class="btn btn--primary">Entrar</button>
                </div>

            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
