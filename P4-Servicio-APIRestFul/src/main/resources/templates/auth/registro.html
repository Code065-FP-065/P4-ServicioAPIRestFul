<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title">Registro de usuario</h1>
        <p class="page-subtitle">
            Crea una cuenta para acceder al área de usuario de la aplicación.
        </p>
    </section>

    <section class="card form-card">
        <div class="card__header">
            <h2 class="card__title">Crear cuenta</h2>
        </div>

        <div class="card__body">

            <div th:if="${mensajeError}" class="alert alert--error" th:text="${mensajeError}">
                Error en el registro.
            </div>

            <form th:action="@{/registro}" th:object="${registroUsuarioDto}" method="post" class="form-grid">

                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input
                            type="text"
                            id="username"
                            th:field="*{username}"
                            placeholder="Introduce un nombre de usuario"
                            required>
                    <span class="field-error"
                          th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}">
                        Error username
                    </span>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            placeholder="Introduce tu correo electrónico"
                            required>
                    <span class="field-error"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">
                        Error email
                    </span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            placeholder="Mínimo 6 caracteres"
                            required>
                    <span class="field-error"
                          th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}">
                        Error password
                    </span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            placeholder="Repite la contraseña"
                            required>
                    <span class="field-error"
                          th:if="${#fields.hasErrors('confirmPassword')}"
                          th:errors="*{confirmPassword}">
                        Error confirmación
                    </span>
                </div>

                <div class="form-actions">
                    <a th:href="@{/login}" class="btn btn--outline">Ya tengo cuenta</a>
                    <button type="submit" class="btn btn--primary">Registrarme</button>
                </div>

            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
