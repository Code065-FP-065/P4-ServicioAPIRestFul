<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nuevo vehiculo')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-container">
    <section class="page-header">
        <h1 class="page-title"
            th:text="${vehiculo.idVehiculo != null} ? 'Editar vehiculo' : 'Nuevo vehiculo'">
            Formulario vehiculo
        </h1>
        <p class="page-subtitle">Completa los datos del vehiculo</p>
    </section>

    <section class="card form-card">
        <div class="card__body">
            <form th:action="@{/admin/vehiculos/guardar}" th:object="${vehiculo}" method="post" class="form-grid">

                <input type="hidden" th:field="*{idVehiculo}">

                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input id="matricula" type="text" th:field="*{matricula}" placeholder="Introduce la matrícula" required>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input id="marca" type="text" th:field="*{marca}" placeholder="Introduce la marca" required>
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input id="modelo" type="text" th:field="*{modelo}" placeholder="Introduce el modelo" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <input id="tipo" type="text" th:field="*{tipo}" placeholder="Introduce el tipo" required>
                </div>

                <div class="form-group">
                    <label for="precioDia">Precio por día</label>
                    <input id="precioDia" type="number" step="0.01" min="0" th:field="*{precioDia}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}" required>
                        <option value="">Selecciona un estado</option>
                        <option th:each="estado : ${estadosVehiculo}"
                                th:value="${estado}"
                                th:text="${estado}">
                        </option>
                    </select>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/vehiculos}" class="btn btn--outline">Cancelar</a>
                    <button type="submit" class="btn btn--primary">Guardar vehículo</button>
                </div>

            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
